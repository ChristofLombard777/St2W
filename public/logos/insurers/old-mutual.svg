<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 76" role="img" aria-label="Old Mutual Insure">
  <title>Old Mutual Insure</title>

  <!-- Green circle emblem -->
  <circle cx="36" cy="38" r="35" fill="#007037"/>

  <!-- Simplified Old Mutual "tree of life" mark in white -->
  <!-- Left figure/leaf -->
  <path d="M23,54 C14,42 17,26 26,18 C28,26 28,40 25,50 Z" fill="white"/>
  <!-- Right figure/leaf -->
  <path d="M49,54 C58,42 55,26 46,18 C44,26 44,40 47,50 Z" fill="white"/>
  <!-- Centre trunk -->
  <rect x="34" y="16" width="4" height="36" rx="2" fill="white"/>
  <!-- Cross branch -->
  <rect x="25" y="28" width="22" height="3" rx="1.5" fill="white"/>

  <!-- OLD MUTUAL text -->
  <text x="82" y="29"
    font-family="Arial,Helvetica,sans-serif"
    font-weight="800"
    font-size="18"
    fill="#1a1a1a"
    letter-spacing="1.4">OLD MUTUAL</text>

  <!-- INSURE text -->
  <text x="82" y="57"
    font-family="Arial,Helvetica,sans-serif"
    font-weight="800"
    font-size="18"
    fill="#007037"
    letter-spacing="4.6">INSURE</text>
</svg>
